# SPA + API/SignalR ters proxy. Tarayıcı tek origin görür (CORS gerekmez);
# Vite dev sunucusundaki proxy ile birebir aynı düzen.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8080;
    }

    # Hash'li dosya adları — uzun cache güvenli
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # İstemci tarafı yönlendirme (/etkinlik/:id, /odeme/sonuc ...)
    location / {
        try_files $uri /index.html;
    }
}
